version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
    volumes:
      - ./frontend/certs:/certs:ro
      - ./frontend:/app  # 호스트 디렉토리를 컨테이너의 /app 디렉토리에 마운트
      - /app/node_modules  # node_modules는 호스트와 분리하여 관리
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SSL_CERT_PATH=${CONTAINER_SSL_CERT_PATH}
      - SSL_CERT_KEY_PATH=${CONTAINER_SSL_CERT_KEY_PATH}
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DB_NAME=${DJANGO_DB_NAME}
      - DJANGO_DB_USER=${DJANGO_DB_USER}
      - DJANGO_DB_PASSWORD=${DJANGO_DB_PASSWORD}
      - DJANGO_DB_HOST=${DJANGO_DB_HOST}
      - DJANGO_DB_PORT=${DJANGO_DB_PORT}
      - DJANGO_SECRET_KEY=${DEV_DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DEV_DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DEV_DJANGO_ALLOWED_HOSTS}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - JWT_ACCESS_TOKEN_LIFETIME=${JWT_ACCESS_TOKEN_LIFETIME}
      - JWT_REFRESH_TOKEN_LIFETIME=${JWT_REFRESH_TOKEN_LIFETIME}
    depends_on:
      - postgres
  postgres:
    image: postgres:12
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
